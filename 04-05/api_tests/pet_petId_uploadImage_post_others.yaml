config:
  target: "{{ $processEnvironment.PET_STORE_API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "pet_petId_uploadImage_post_others.csv"
    fields:
      - "petId"
      - "additionalMetadata"
      - "file"
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: "Non-Success API Responses Test"
    flow:
      - log: "Testing with invalid petId"
      - post:
          url: "/v2/pet/invalid_petId/uploadImage"
          headers:
            Content-Type: "multipart/form-data"
            api_key: "{{ $processEnvironment.PET_STORE_AUTH_TOKEN }}"
          formData:
            additionalMetadata: "Invalid metadata"
            file: "dummy.jpg"
          expect:
            - statusCode: 400
            - hasHeader: "Content-Type"
            - headerEquals: 
                header: "Content-Type"
                value: "application/json"
      - think: 1

      - log: "Testing without authorization header"
      - post:
          url: "/v2/pet/{{ petId }}/uploadImage"
          headers:
            Content-Type: "multipart/form-data"
          formData:
            additionalMetadata: "Testing without auth"
            file: "test.jpg"
          expect:
            - statusCode: 401
            - hasHeader: "Content-Type"
            - headerEquals: 
                header: "Content-Type"
                value: "application/json"
      - think: 1

      - log: "Testing with incorrect Content-Type"
      - post:
          url: "/v2/pet/{{ petId }}/uploadImage"
          headers:
            Content-Type: "text/plain"
            api_key: "{{ $processEnvironment.PET_STORE_AUTH_TOKEN }}"
          formData:
            additionalMetadata: "Wrong content type"
            file: "test.jpg"
          expect:
            - statusCode: 415
            - hasHeader: "Content-Type"
            - headerEquals: 
                header: "Content-Type"
                value: "application/json"
      - think: 1

      - log: "Testing with missing required formData field"
      - post:
          url: "/v2/pet/{{ petId }}/uploadImage"
          headers:
            Content-Type: "multipart/form-data"
            api_key: "{{ $processEnvironment.PET_STORE_AUTH_TOKEN }}"
          formData:
            additionalMetadata: "Missing file field"
          expect:
            - statusCode: 400
            - hasHeader: "Content-Type"
            - headerEquals: 
                header: "Content-Type"
                value: "application/json"
      - think: 1

      - log: "Testing with invalid URL"
      - post:
          url: "/v2/pet/{{ petId }}/uploadImag"
          headers:
            Content-Type: "multipart/form-data"
            api_key: "{{ $processEnvironment.PET_STORE_AUTH_TOKEN }}"
          formData:
            additionalMetadata: "Invalid URL"
            file: "test.jpg"
          expect:
            - statusCode: 404
            - hasHeader: "Content-Type"
            - headerEquals: 
                header: "Content-Type"
                value: "application/json"
      - think: 1
