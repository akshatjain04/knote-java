config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 300
      arrivalRate: 5
  plugins:
    expect: {}
  environments:
    dev:
      baseurl: "{{ $processEnvironment.API_HOST }}"
      token: "{{ $processEnvironment.AUTH_TOKEN }}"
  payload:
    path: "BulkOperations.csv"
    fields:
      - "username"
      - "email"
      - "firstName"
      - "lastName"
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: Create Users
    flow:
      - post:
          url: "/user/createWithList"
          headers:
            Authorization: "Bearer {{ $environment.token }}"
          json:
            - id: 0
              username: "{{ username }}"
              firstName: "{{ firstName }}"
              lastName: "{{ lastName }}"
              email: "{{ email }}"
              password: "password"
              phone: "phone"
              userStatus: 0
          expect:
            - statusCode: 200
      - log: "All users should be created successfully"
      - think: 1
  
  - name: Create Pets
    flow:
      - post:
          url: "/pet"
          headers:
            Authorization: "Bearer {{ $environment.token }}"
          json:
            id: 0
            category:
              id: 0
              name: "Dog"
            name: "Max"
            photoUrls:
              - "string"
            tags:
              - id: 0
                name: "string"
            status: "available"
          expect:
            - statusCode: 405
      - think: 1
      - post:
          url: "/pet"
          headers:
            Authorization: "Bearer {{ $environment.token }}"
          json:
            id: 1
            category:
              id: 1
              name: "Dog"
            name: "Charlie"
            photoUrls:
              - "string"
            tags:
              - id: 1
                name: "string"
            status: "available"
          expect:
            - statusCode: 405
      - log: "All pets should be added successfully"
      - think: 1
