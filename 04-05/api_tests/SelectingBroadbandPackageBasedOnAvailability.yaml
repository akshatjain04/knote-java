config:
  target: "{{ $processEnvironment.API_HOST }}"
  processor: "./processors.js"
  phases:
    - duration: 60
      arrivalRate: 1
  payload:
    path: "SelectingBroadbandPackageBasedOnAvailability.csv"
    fields:
      - "subscriberId"
      - "packageId"
    skipHeader: true
    delimiter: "^|^"
  defaults:
    headers:
      Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
  plugins:
    expect: {}

scenarios:
  - name: "Selecting a broadband package based on availability"
    flow:
      - log: "Attempting to select a broadband package based on availability for John Doe."
      - post:
          url: "/configuration"
          json:
            configuration:
              action:
                type: "HGW_WIFI_CONFIGURATION"
                parameters:
                  frequencyBand: "2.4GHz"
                  SSID: "BL_1000MB"
              customer:
                subscriberId: "{{ subscriberId }}"
          headers:
            Content-Type: "application/json"
          expect:
            - statusCode: 200
            - hasProperty: "configuration"
            - equals: 
                json: "$.configuration.id"
                value: "Expected configuration ID from the response"
      - log: "Validating the selection of the broadband package."
      - think: 1
      - log: "Confirming the broadband package for John Doe's address."
      - post:
          url: "/listener/configurationResultEvent"
          json:
            notification:
              customer:
                subscriberId: "{{ subscriberId }}"
              date: "2021-11-25T18:31:06.857-03:00"
              configuration:
                id: "Expected configuration ID from previous response"
                type: "HGW_WIFI_CONFIGURATION"
                startDate: "2021-11-25T19:31:06-02"
                endDate: "2021-11-25T19:31:06-02"
                state: "FINISHED"
          headers:
            Content-Type: "application/json"
          expect:
            - statusCode: 204
            - hasProperty: "notification"
      - think: 1
