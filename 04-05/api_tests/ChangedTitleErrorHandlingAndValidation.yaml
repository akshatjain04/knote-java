config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 5
  environments:
    staging:
      target: "{{ $processEnvironment.API_HOST }}"
  payload:
    path: "ChangedTitleErrorHandlingAndValidation.csv"
    fields:
      - "petId"
      - "username"
      - "password"
    skipHeader: true
    delimiter: "^|^" 
  plugins:
    expect: {}
   
scenarios:

  - name: "Pet error handling and validation"
    flow:

      - log: "Trying to create a pet without required fields"
      - post:
          url: "/v2/pet"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json: 
              id: 0
              name: ""
              status: ""
          expect:
            - statusCode: 405

      - log: "Trying to find a pet with invalid ID"
      - get: 
          url: "/v2/pet/{{ petId }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
            petId: -1
          expect:
            - statusCode: 404

  - name: "Order error handling and validation"
    flow:

      - log: "Trying to fetch an order with invalid ID"
      - get:
          url: "/v2/store/order/-1"
          expect:
            - statusCode: 400

      - log: "Trying to fetch an order with invalid ID"
      - get:
          url: "/v2/store/order/11"
          expect:
            - statusCode: 400

  - name: "User error handling and validation"
    flow:

      - log: "Trying to create a user without required fields"
      - post: 
          url: "/v2/user/createWithArray"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json: 
                  username: ""
                  firstName: ""
                  lastName: ""
                  email: ""
                  password: "{{ password }}"
                  phone: ""
                  userStatus: 0
          expect:
            - hasProperty: "message"

      - log: "Trying to log in with invalid credentials"
      - get: 
          url: "/v2/user/login?username={{ username }}&password=wrong_password"
          expect:
            - statusCode: 400
