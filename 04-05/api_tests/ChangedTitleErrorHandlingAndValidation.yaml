config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "ChangedTitleErrorHandlingAndValidation.csv"
    fields: ["username", "password"]
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: "Petstore E2E Flow"
    flow:
      
      - post:
          url: "/pet"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            status: "available"
          expect:
            - statusCode: 405
            - hasProperty: "message"
      - log: "POST /pet without required fields results a 405 status code with corresponding error message"
      - think: 1

      - get:
          url: "/pet/0"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 404
            - hasProperty: "message"
      - log: "GET /pet with invalid petId results a 404 status code with corresponding error message"
      - think: 1

      - get:
          url: "/store/order/0"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
            - hasProperty: "message"
      - log: "GET /store/order with orderId less than 1 returns status code 400 and corresponding error message"
      - think: 1

      - get:
          url: "/store/order/11"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
            - hasProperty: "message"
      - log: "GET /store/order with orderId greater than 10 returns status code 400 and corresponding error message"
      - think: 1

      - post:
          url: "/user"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            username: "{{ username }}"
          expect:
            - hasProperty: "message"
      - log: "POST /user without required fields generates error response"
      - think: 1

      - get:
          url: "/user/login?username={{ username }}&password={{ password }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
            - hasProperty: "message"
      - log: "GET /user/login with invalid credentials generates a 400 status code and corresponding error message"
      - think: 1   
