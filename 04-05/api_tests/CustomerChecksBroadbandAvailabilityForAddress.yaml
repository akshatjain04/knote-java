config:
  target: "{{ $processEnvironment.API_HOST }}"
  environments:
    production:
      API_HOST: "https://api.production.com"
  phases:
    - duration: 60
      arrivalRate: 1
  payload:
    path: "CustomerChecksBroadbandAvailabilityForAddress.csv"
    skipHeader: true
    fields:
      - "subscriberId"
      - "address"
      - "actionType"
      - "frequencyBand"
      - "wifiIndex"
      - "passwd"
      - "mode"
  processor: "./processors.js"
  plugins:
    expect: {}

scenarios:
  - name: "Customer checks broadband availability for an address"
    flow:
      - log: "John Doe with subscriber ID SVTL001 wants to check broadband availability for address 14393"
      - post:
          url: "/configuration"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            configuration:
              action:
                type: "{{ actionType }}"
                parameters:
                  frequencyBand: "{{ frequencyBand }}"
              customer:
                subscriberId: "{{ subscriberId }}"
          expect:
            - statusCode: 200
            - hasProperty: "configuration"
            - hasProperty: "id"
      - think: 1
      - log: "System validates the address and fetches broadband availability"
      - post:
          url: "/configuration"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            configuration:
              action:
                type: "{{ actionType }}"
                parameters:
                  wifiIndex: "{{ wifiIndex }}"
                  passwd: "{{ passwd }}"
                  mode: "{{ mode }}"
              customer:
                subscriberId: "{{ subscriberId }}"
          expect:
            - statusCode: 200
            - hasProperty: "configuration"
            - hasProperty: "id"
      - think: 1
      - log: "Returns a list of available broadband packages"
      - post:
          url: "/configuration"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            configuration:
              action:
                type: "{{ actionType }}"
              customer:
                subscriberId: "{{ subscriberId }}"
          expect:
            - statusCode: 200
            - hasProperty: "configuration"
            - hasProperty: "id"
