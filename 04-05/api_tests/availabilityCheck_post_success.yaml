config:
  target: "{{ $processEnvironment.ALIAS_1_API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 1
  payload:
    path: "availabilityCheck_post_success.csv"
    fields:
      - "subscriberId"
      - "addressId"
      - "complementType"
      - "complementDescription"
      - "complementValue"
    skipHeader: true
    delimiter: "^|^"
  plugins:
