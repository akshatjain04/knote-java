scenarios:
  - name: "Validate successful responses for availability check API"
    flow:
      - log: "Starting availability check with valid subscriber ID and address ID"
      - post:
          url: "/availabilityCheck"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer {{$processEnvironment.ALIAS_1_AUTH_TOKEN}}"
          json:
            customer:
              subscriberId: "{{ subscriberId }}"
            address:
              id: "{{ addressId }}"
              complement:
                complements:
                  - type: "{{ complementType }}"
                    description: "{{ complementDescription }}"
                    value: "{{ complementValue }}"
          expect:
            - statusCode: 200
            - hasProperty: "control"
            - hasProperty: "resource"
            - hasProperty: "resource.inventoryId"
            - hasProperty: "resource.maxBandwidth"
            - hasProperty: "resource.availabilityType"
            - hasProperty: "resource.availabilityCode"
            - hasProperty: "resource.availabilityDescription"
            - hasProperty: "resource.products"
      - think: 1
      - log: "Starting availability check with valid subscriber ID without complements"
