config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    ensure: {}
    expect: {}
  payload:
    path: "ScenarioDeleteAuthorizationTest.csv"
    skipHeader: true
    delimiter: "^|^"
    fields:
      - "authorizationId"
      - "email"
  processor:
    - log: "Initializing the test"
  phases:
    - duration: 60
      arrivalRate: 1

  defaults:
    headers:
      Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"

scenarios:
  - flow:
      - log: "Sending DELETE request to delete authorization with ID {{ authorizationId }}"
      - delete:
          url: "/authorizations/{{ authorizationId }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
            Token: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasHeader: "api-version"
            - equals: [{ "header": "api-version", "value": "1.0.0" }]
      - think: 1
      - log: "Verifying authorization does not appear in GET request for /authorizations"
      - get:
          url: "/authorizations"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
            Token: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasHeader: "api-version"
            - equals: [{ "header": "api-version", "value": "1.0.0" }]
            - hasProperty: "total"
            - hasProperty: "authorizations"
            - notHasProperty: "authorizations.{{ authorizationId }}"
      - think: 1
