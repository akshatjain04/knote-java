config:
  target: "{{ $processEnvironment.API_HOST }}/v2"
  phases:
    - duration: 60
      arrivalRate: 10
  defaults:
    headers:
      Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
  plugins:
    expect: {}
  payload:
    path: "ErrorHandlingAndValidation.csv"
    fields:
      - "name"
      - "photoUrls"
      - "tagsId"
      - "tagsName"
      - "status"
      - "username"
      - "firstName"
      - "lastName"
      - "email"
      - "password"
      - "phone"
      - "userStatus"
    skipHeader: true
    delimiter: "^|^"
scenarios:
  - name: Create pet without required fields
    flow:
      - log: "Attempting to create a pet without required fields"
      - post:
          url: "/pet"
          json:
            name: "{{ name }}"
            photoUrls: ["{{ photoUrls }}"]
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
        expect:
          - statusCode: 405
          - contentType: "application/json"
          - hasProperty: "Invalid input"

  - name: Find pet with invalid ID
    flow:
      - log: "Attempting to find a pet with invalid ID"
      - get:
          url: "/pet/invalid_id"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
        expect:
          - statusCode: 400
          - contentType: "application/json"
          - hasProperty: "Invalid ID supplied"

  - name: Fetch order with ID less than 1
    flow:
      - log: "Attempting to fetch an order with ID less than 1"
      - get:
          url: "/store/order/0"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
        expect:
          - statusCode: 400
          - contentType: "application/json"
          - hasProperty: "Invalid ID supplied"

  - name: Fetch order with ID greater than 10
    flow:
      - log: "Attempting to fetch an order with ID greater than 10"
      - get:
          url: "/store/order/11"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
        expect:
          - statusCode: 400
          - contentType: "application/json"
          - hasProperty: "Invalid ID supplied"

  - name: Create user without required fields
    flow:
      - log: "Attempting to create a user without required fields"
      - post:
          url: "/user"
          json:
            username: "{{ username }}"
        expect:
          - statusCode: 400
          - contentType: "application/json"
          - hasProperty: "Invalid user supplied"

  - name: Log in with invalid credentials
    flow:
      - log: "Attempting to log in with invalid credentials"
      - get:
          url: "/user/login?username=invalid_user&password=invalid_password"
        expect:
          - statusCode: 400
          - contentType: "application/json"
          - hasProperty: "Invalid username/password supplied"
