config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "CreateMyAccountTest.csv"
    fields:
      - "email"
      - "password"
      - "name"
      - "image"
    skipHeader: true
    delimiter: "^|^"
  processor: {}

scenarios:
  createMyAccount:
    flow:
      - log: "Create new account"
      - post:
          url: "/accounts"
          headers:
            content-type: "application/json"
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
            commit-hash: "{{ commit_hash_variable }}"
          json:
            email: "{{ email }}"
            password: "{{ password }}"
            name: "{{ name }}"
            image: "{{ image }}"
          expect:
            - statusCode: 201
            - hasProperty: "api-version"
            - hasProperty: "commit-hash"

      - think: 2

      - log: "Verify account creation by fetching account details"
      - get:
          url: "/me"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "id"
            - hasProperty: "did"
            - hasProperty: "name"
            - hasProperty: "image"
            - hasProperty: "email"
            - hasProperty: "settings"
            - hasProperty: "createdAt"
            - hasProperty: "updatedAt"
            - hasProperty: "api-version"
