config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "AccountAuthorizationGrantAccess.csv"
    skipHeader: true
    fields:
      - "email"
      - "name"
    delimiter: "^|^"
  environments:
    production:
      target: "http://localhost:8080"
    staging:
      target: "http://staging.localhost:8080"
  phases:
    - duration: 30
      arrivalRate: 1
  defaults:
    headers:
      Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
      commit-hash: "928d28d"
scenarios:
  - scenario: "Grant authorization"
    flow:
      - log: "Creating a new account"
      - post:
          url: "/accounts"
          headers:
            content-type: "application/json"
          json:
            email: "{{ email }}"
          capture:
            - json: "$.id"
              as: "accountId"
          expect:
            - statusCode: 201
            - hasHeader: "api-version"
            - headerEquals:
                header: "api-version"
                equals: "1.0.0"
            - hasHeader: "commit-hash"
            - headerEquals:
                header: "commit-hash"
                equals: "928d28d"
      - think: 2
      - log: "Granting access to the new account"
      - post:
          url: "/authorizations"
          headers:
            content-type: "application/json"
            Token: "{{ $processEnvironment.AUTH_TOKEN }}"
          json:
            email: "{{ email }}"
          capture:
            - json: "$.id"
              as: "authorizationId"
          expect:
            - statusCode: 201
            - hasHeader: "api-version"
            - headerEquals:
                header: "api-version"
                equals: "1.0.0"
            - hasHeader: "location"
            - hasProperty: "id"
            - hasProperty: "name"
            - hasProperty: "email"
            - hasProperty: "createdAt"
            - hasProperty: "updatedAt"
      - think: 2
      - log: "Confirming access via GET request"
      - get:
          url: "/authorizations"
          headers:
            content-type: "application/json"
            Token: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasHeader: "api-version"
            - headerEquals:
                header: "api-version"
                equals: "1.0.0"
            - hasProperty: "total"
            - hasProperty: "authorizations"
            - hasProperty: "authorizations.0.id"
            - hasProperty: "authorizations.0.name"
            - hasProperty: "authorizations.0.email"
            - hasProperty: "authorizations.0.createdAt"
            - hasProperty: "authorizations.0.updatedAt"
            - equals:
                - "{{ $environment['authorizationId'] }}"
                - "{{ authorizationId }}"
