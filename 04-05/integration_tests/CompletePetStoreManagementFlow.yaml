config:
  target: '{{ $processEnvironment.API_HOST }}'
  plugins:
    expect: {}
  payload:
    path: CompletePetStoreManagementFlow.csv
    skipHeader: true
    fields:
      - username
      - email
      - firstName
      - lastName
      - password
      - phone
    delimiter: ^|^
  processor: ./processors.js
scenarios:
  - name: Create new user
    flow:
      - log: Creating a new user
      - post:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/user'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
          json:
            username: '{{ username }}'
            email: '{{ email }}'
            firstName: '{{ firstName }}'
            lastName: '{{ lastName }}'
            password: '{{ password }}'
            phone: '{{ phone }}'
      - expect:
          statusCode: 200
      - think: 1
  - name: Log in with new user
    flow:
      - log: Logging in with the new user
      - get:
          url: >-
            {{ $processEnvironment.API_HOST_1 }}/v2/user/login?username={{
            username }}&password={{ password }}
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
      - expect:
          statusCode: 200
          hasHeader:
            - X-Expires-After
            - X-Rate-Limit
      - think: 1
  - name: Add new pet to the store
    flow:
      - log: Adding a new pet to the store
      - post:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/pet'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
          json:
            name: Fluffy
            category:
              name: Cat
            status: available
      - expect:
          statusCode: 200
      - think: 1
  - name: Retrieve pet by ID
    flow:
      - log: Retrieving the pet by its ID
      - get:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/pet/{{ id }}'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
      - expect:
          statusCode: 200
          hasProperty:
            - id
            - name
            - category
            - status
      - think: 1
  - name: Upload image for the pet
    flow:
      - log: Uploading an image for the pet
      - post:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/pet/{{ id }}/uploadImage'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
      - expect:
          statusCode: 200
      - think: 1
  - name: Update pet's status to pending
    flow:
      - log: Updating the pet's status to pending
      - post:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/pet/{{ id }}'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
          json:
            name: Fluffy
            status: pending
      - expect:
          statusCode: 200
      - think: 1
  - name: Search for pets with status pending
    flow:
      - log: Searching for pets with status pending
      - get:
          url: >-
            {{ $processEnvironment.API_HOST_1
            }}/v2/pet/findByStatus?status=pending
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
      - expect:
          statusCode: 200
          hasProperty:
            - id
            - name
            - category
            - status
      - think: 1
  - name: Search for pets by tag friendly
    flow:
      - log: Searching for pets by tag friendly
      - get:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/pet/findByTags?tags=friendly'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
      - expect:
          statusCode: 200
          hasProperty:
            - id
            - name
            - category
            - status
      - think: 1
  - name: Check store inventory
    flow:
      - log: Checking the store inventory
      - get:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/store/inventory'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
      - expect:
          statusCode: 200
          hasProperty:
            - available
            - pending
            - sold
      - think: 1
  - name: Create an order for the pet
    flow:
      - log: Creating an order for the pet
      - post:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/store/order'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
          json:
            petId: '{{ id }}'
            quantity: 1
            shipDate: tomorrow
            status: placed
      - expect:
          statusCode: 200
          hasProperty:
            - id
            - petId
            - quantity
            - shipDate
            - status
            - complete
      - think: 1
  - name: Retrieve order by ID
    flow:
      - log: Retrieving the order by its ID
      - get:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/store/order/{{ orderId }}'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
      - expect:
          statusCode: 200
          hasProperty:
            - id
            - petId
            - quantity
            - shipDate
            - status
            - complete
      - think: 1
  - name: Approve the order
    flow:
      - log: Approving the order
      - post:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/store/order/{{ orderId }}'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
          json:
            status: approved
      - expect:
          statusCode: 200
          hasProperty:
            - status
      - think: 1
  - name: Mark order as delivered
    flow:
      - log: Marking the order as delivered
      - post:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/store/order/{{ orderId }}'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
          json:
            status: delivered
      - expect:
          statusCode: 200
          hasProperty:
            - status
      - think: 1
  - name: Delete the order
    flow:
      - log: Deleting the order
      - delete:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/store/order/{{ orderId }}'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
      - expect:
          statusCode: 200
      - think: 1
  - name: Delete the pet
    flow:
      - log: Deleting the pet
      - delete:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/pet/{{ id }}'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
      - expect:
          statusCode: 200
      - think: 1
  - name: Delete user account
    flow:
      - log: Deleting the user account
      - delete:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/user/{{ username }}'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
      - expect:
          statusCode: 200
      - think: 1
  - name: Log out
    flow:
      - log: Attempting to log out
      - get:
          url: '{{ $processEnvironment.API_HOST_1 }}/v2/user/logout'
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
      - expect:
          statusCode: 200
